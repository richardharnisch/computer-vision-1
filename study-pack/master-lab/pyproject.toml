[project]
name = "cv1-master-lab"
version = "0.1.0"
description = "A compact, offline-after-setup synthesis of CV1 Labs 1-5"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "matplotlib>=3.9,<4",
  "opencv-python-headless>=4.10,<5",
  "torch>=2.5,<3",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
